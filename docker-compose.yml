services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: postgis
    restart: unless-stopped

    environment:
      POSTGRES_DB: geodata
      POSTGRES_USER: gis_user
      POSTGRES_PASSWORD: change_this_password

    ports:
      - "5432:5432"

    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./data:/data

volumes:
  postgis_data: